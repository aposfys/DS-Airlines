{% extends "base.html" %}
{% block content %}
<div class="jumbotron p-5 mb-4 bg-light rounded-3 text-center">
    <div class="container-fluid py-5">
      <h1 class="display-5 fw-bold">Welcome to DS Airlines</h1>
      <p class="col-md-8 fs-4 mx-auto">Your journey begins here. Experience the best flight booking service.</p>
      {% if not current_user.is_authenticated %}
      <a class="btn btn-primary btn-lg" href="{{ url_for('auth.signup') }}" role="button">Sign Up Now</a>
      <a class="btn btn-outline-primary btn-lg" href="{{ url_for('auth.login') }}" role="button">Login</a>
      {% else %}
      <a class="btn btn-primary btn-lg" href="{{ url_for('main.search_flight') }}" role="button">Book a Flight</a>
      {% endif %}
    </div>
</div>
{% endblock %}
