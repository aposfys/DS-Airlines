{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-5">
            <div class="card-header">Update Flight Price</div>
            <div class="card-body">
                <form method="POST">
                    {{ form.hidden_tag() }}
                    <div class="mb-3">
                        {{ form.unique_code.label(class="form-label") }}
                        {{ form.unique_code(class="form-control") }}
                    </div>
                    <div class="mb-3">
                        {{ form.new_price.label(class="form-label") }}
                        {{ form.new_price(class="form-control") }}
                    </div>
                    <button type="submit" class="btn btn-primary">Update Price</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
